apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "backend.labels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5000